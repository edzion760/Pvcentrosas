<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVCENTRO – Control del negocio</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mut:#6b7385;--line:#e2e5ec;--pri:#0b5fff;--pri2:#e8f0ff;--ok:#128a4a;--bad:#c62828;--warn:#b26a00;--warnbg:#fff4de}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--mut:#98a1b5;--line:#2c3342;--pri:#5b92ff;--pri2:#1c2740;--ok:#3ec47a;--bad:#ff6b6b;--warn:#ffb74d;--warnbg:#3a2d14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
h1,h2,h3{margin:0 0 .5rem}h2{font-size:1.15rem}h3{font-size:1rem}
header{background:var(--card);border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:1.05rem}header .sp{flex:1}
nav{display:flex;gap:.25rem;overflow-x:auto;padding:.5rem .6rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:4}
nav button{flex:none;border:0;background:transparent;color:var(--mut);padding:.5rem .8rem;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:1.35rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.6rem}
.row>label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:.2rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.5rem .9rem;border-radius:8px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.d{color:var(--bad)}button.s{padding:.25rem .55rem;font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:.8rem;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow:auto;max-height:65vh}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag{display:inline-block;padding:.05rem .45rem;border-radius:99px;background:var(--pri2);color:var(--pri);font-size:.75rem}
.tag.v{background:#fde7e7;color:var(--bad)}
.alert{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:.6rem .8rem;margin-bottom:.8rem}
.res{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto;margin-top:.3rem}
.res div{padding:.45rem .6rem;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:.5rem}
.res div:hover{background:var(--pri2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:20;overflow:auto}
.modal>div{background:var(--card);border-radius:14px;padding:1.2rem;max-width:560px;width:100%}
.login{max-width:380px;margin:12vh auto;text-align:center}
.login button.u{display:block;width:100%;margin:.5rem 0;padding:.9rem;font-size:1.05rem}
pre.rc{background:var(--bg);padding:.8rem;border-radius:8px;white-space:pre-wrap;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
.bar{height:10px;background:var(--pri);border-radius:5px}
#grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:.6rem}
.pc{border:1px solid var(--line);border-radius:12px;padding:.4rem;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:.3rem;user-select:none}
.pc:active{transform:scale(.98)}
.ph{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:var(--pri2);display:flex;align-items:center;justify-content:center;color:var(--pri);font-weight:700;font-size:1.6rem}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .stk{position:absolute;left:5px;bottom:5px;background:#0d3b3b;color:#fff;font-size:.7rem;padding:.1rem .45rem;border-radius:99px}
.ph .stk.z{background:#c62828}
.ph .cnt{position:absolute;right:5px;top:5px;background:#12b76a;color:#fff;font-weight:700;min-width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:.8rem;padding:0 6px}
.pc .pn{font-size:.85rem;line-height:1.2;height:2.4em;overflow:hidden}.pc .pp{font-weight:700}
.pc.rapid{align-items:center;justify-content:center;color:var(--ok);font-weight:700;min-height:150px;text-align:center}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.35rem .8rem;font:inherit;cursor:pointer}.chips button.on{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.th{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--pri2);vertical-align:middle;margin-right:.5rem}
.cartbar{position:sticky;bottom:0;z-index:3}
.cfab,.shhead{display:none}
.cl{display:grid;grid-template-columns:52px 1fr auto;gap:.2rem .6rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.cl .cth{width:52px;height:52px;border-radius:9px;overflow:hidden;background:var(--pri2);display:flex;align-items:center;justify-content:center;color:var(--pri);font-weight:700}
.cl .cth img{width:100%;height:100%;object-fit:cover}
.cl .cn{font-size:.92rem;line-height:1.2}
.cl .cp{display:flex;align-items:center;gap:.3rem;color:var(--mut);font-size:.8rem;margin-top:.2rem}
.cl .cp input{width:92px;text-align:right;padding:.25rem .4rem}
.cl .cs{font-weight:700;text-align:right;white-space:nowrap}
.cl .cq{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.qb{display:flex;align-items:center;gap:.4rem}
.qb button{width:44px;height:44px;border-radius:10px;border:0;background:#0b7a4b;color:#fff;font-size:1.5rem;font-weight:700;cursor:pointer;line-height:1}
.qb button.m{background:var(--pri2);color:var(--ink)}
.qb button.t{background:#d92d20;font-size:1.1rem}
.qb input{width:64px;text-align:center;font-size:1.1rem;font-weight:700;padding:.5rem .2rem}
@media(max-width:800px){
 #cartsheet{display:none}
 body.cartopen #cartsheet{display:block;position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:0 .7rem 1rem;-webkit-overflow-scrolling:touch}
 body.cartopen{overflow:hidden}
 .shhead{display:flex;align-items:center;gap:.6rem;position:sticky;top:0;background:var(--bg);padding:.7rem 0;z-index:2}
 .shhead b{font-size:1.25rem;flex:1}
 .shhead .bk{width:44px;height:44px;border-radius:99px;border:0;background:var(--pri2);color:var(--ink);font-size:1.4rem;cursor:pointer}
 .cfab{display:flex;position:fixed;left:.7rem;right:.7rem;bottom:.7rem;z-index:10;background:#0b7a4b;color:#fff;border:0;border-radius:14px;padding:.9rem 1.1rem;font:inherit;font-weight:700;font-size:1.05rem;align-items:center;gap:.7rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
 .cfab .n{background:#fff;color:#0b7a4b;min-width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:.9rem;padding:0 6px}
 .cfab .t{flex:1;text-align:left}
 #cartsheet .cartbar{position:sticky;bottom:0}
 .shhead+.card h3{display:none}
 body:has(#cfab) #toast{bottom:84px!important}
 main:has(.cfab){padding-bottom:5.5rem}
}
@media(max-width:800px){input,select,textarea{font-size:16px}input[type=file]{max-width:100%;width:100%}.row>label{min-width:0;max-width:100%}.card{overflow-x:auto}.row>label[style*=min-width]{min-width:0!important}}
@media(max-width:640px){main{padding:.6rem}header{padding:.5rem .7rem}th,td{padding:.4rem .3rem}.hide-s{display:none}}
</style>
</head>

async function loadDB(){idb=await openIDB();let raw=null;
 if(idb){raw=await new Promise(res=>{try{const q=idb.transaction('kv').objectStore('kv').get(DBKEY);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})}
 if(!raw){try{const t=localStorage.getItem(DBKEY);if(t)raw=JSON.parse(t)}catch(e){}}
 return raw}

 if(idb){try{await new Promise((res,rej)=>{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(JSON.parse(JSON.stringify(db)),DBKEY);tx.oncomplete=res;tx.onerror=rej;tx.onabort=rej});persistOK=true}catch(e){}}

 const b=$('#warnstore');if(b)b.style.display=persistOK?'none':'block'}

 users:{edison:{name:'Edison',role:'owner',store:null,pin:''},wilmer:{name:'Wilmer',role:'seller',store:'sangil',pin:''},dario:{name:'Darío',role:'seller',store:'socorro',pin:''}},

let db,U=null,S={tab:'home',store:'all',from:monthStart(),to:todayStr(),carts:{sale:[],buy:[],trans:[],recv:[]},q:''};
let _prod=null,_stock=null;
function dirty(){_prod=null;_stock=null}
function recs(){return Object.values(db.records)}
const EXT=()=>db.ext||{costs:{},stock:{},hist:[]};
function products(){if(_prod)return _prod;const p={};SEED.products.forEach(x=>{p[x.sku]=Object.assign({},x);if(EXT().costs[x.sku]!=null)p[x.sku].cost=EXT().costs[x.sku]});
 recs().filter(r=>r.type==='product').sort((a,b)=>a.ts-b.ts).forEach(r=>{p[r.sku]=Object.assign(p[r.sku]||{iva:.19,unit:'Unidad',min:0},r.data)});
 return _prod=p}
function stock(){if(_stock)return _stock;const s={};
 const add=(sku,st,q)=>{(s[sku]=s[sku]||{sangil:0,socorro:0})[st]+=q};
 const OS=EXT().stock;for(const k in OS){s[k]={sangil:OS[k].sangil||0,socorro:OS[k].socorro||0}}
 recs().forEach(r=>{if(r.void)return;
  if(r.type==='sale')r.lines.forEach(l=>add(l.sku,r.store,-l.qty));
  else if(r.type==='purchase')r.lines.forEach(l=>add(l.sku,r.store,l.qty));
  else if(r.type==='transfer')r.lines.forEach(l=>{add(l.sku,r.from,-l.qty);add(l.sku,r.to,l.qty)});
  else if(r.type==='adjust')add(r.sku,r.store,r.delta)});
 return _stock=s}
const visStores=()=>U.role==='owner'?['sangil','socorro']:[U.store];
const curStore=()=>U.role==='owner'?(S.store==='all'?null:S.store):U.store;
function inScope(r){const st=curStore();if(!st)return true;return(r.store||r.from)===st||r.to===st}
function active(type,from,to,store){return recs().filter(r=>r.type===type&&!r.void&&(!from||r.date>=from)&&(!to||r.date<=to)&&(!store||r.store===store))}
function newRec(type,data){const st=data.store||data.from||U.store||'sangil';const id=(st==='sangil'?'SG':'SO')+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const r=Object.assign({id,type,by:U.name,ts:Date.now()},data);db.records[id]=r;save();return r}
function touch(r){r.ts=Date.now();save()}
function saleNum(store,date){const n=recs().filter(r=>r.type==='sale'&&r.store===store&&r.date===date).length+1;return(store==='sangil'?'SG':'SO')+'-'+date.slice(2,4)+date.slice(5,7)+date.slice(8,10)+'-'+pad(n)}
function saleCost(r){if(r.type==='daily')return r.total*(1-db.estMargin);const P=products();return r.lines.reduce((a,l)=>a+(l.sku[0]==='_'?l.qty*l.price*(1-db.estMargin):l.qty*(l.cost||(P[l.sku]||{}).cost||0)),0)}
function collected(sale){return recs().filter(r=>r.type==='collect'&&!r.void&&r.saleId===sale.id).reduce((a,r)=>a+r.amount,0)}
function agg(from,to,store){const o={ventas:0,n:0,costo:0,iva:0,gastos:0,compras:0,ivaC:0,ret:0,byExp:{},byMethod:{}};
 recs().forEach(r=>{if(r.void||r.date<from||r.date>to||(store&&r.store!==store))return;
  if(r.type==='sale'||r.type==='daily'){o.ventas+=r.total;o.n+=r.type==='sale'?1:0;o.costo+=saleCost(r);o.iva+=r.total-r.total/IVA;o.ret+=r.ret||0;

  else if(r.type==='purchase'){o.compras+=r.total;o.ivaC+=r.total-r.total/IVA}});

function cashDay(store,date){let e=0,parts={ventas:0,cobros:0,gastos:0,compras:0};
 recs().forEach(r=>{if(r.void||r.date!==date||r.store!==store)return;
  if(r.type==='sale'&&r.method==='Efectivo')parts.ventas+=r.total;

 <label>Cliente<input id="f-cust" placeholder="Mostrador / nombre" style="min-width:200px"></label>
 <label>Forma de pago<select id="f-method">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></label>
 <label>Descuento $<input id="f-disc" inputmode="numeric" value="0" style="width:110px" oninput="drawTot('sale')"></label>
 <label>No. factura electrónica (Facturatech)<input id="f-fact" placeholder="opcional"></label></div>
 <label style="font-size:.9rem"><input type="checkbox" id="f-ret" onchange="drawTot('sale')"> El cliente practicó retención en la fuente (2,5%)</label></div>
 <div class="card cartbar"><div class="row"><div id="tot-sale"></div><span class="sp" style="flex:1"></span><button class="b" onclick="clearCart()">Limpiar</button><button class="b p" onclick="saveSale()">Guardar venta</button></div></div></div>`}
function cartOpen(on){if(on){document.body.classList.add('cartopen');const s=$('#cartsheet');if(s)s.scrollTop=0;try{history.pushState({c:1},'')}catch(e){}}
 else if(document.body.classList.contains('cartopen')){document.body.classList.remove('cartopen');if(history.state&&history.state.c){try{history.back()}catch(e){}}}}
window.addEventListener('popstate',()=>document.body.classList.remove('cartopen'));
function clearCart(){if(S.carts.sale.length&&!confirm('¿Vaciar el carrito?'))return;S.carts.sale=[];drawLines('sale');drawGrid();cartOpen(false)}
function qtyLine(i,d){const l=S.carts.sale[i];if(!l)return;if(d<0&&l.qty<=1){delLine('sale',i);return}l.qty=Math.round((l.qty+d)*100)/100;drawLines('sale');drawGrid()}
function drawFab(){const f=$('#cfab');if(!f)return;const c=S.carts.sale||[];const n=c.length;const d=cop((($('#f-disc'))||{}).value);const tt=Math.max(0,lineTotal('sale')-d);
 f.innerHTML=n?`<span class="n">${n}</span><span class="t">Ver carrito</span><span>${fmt(tt)} ›</span>`:`<span class="t">Carrito vacío · toca un producto</span>`}
function saveSale(){const c=S.carts.sale;if(!c.length)return toast('Agrega al menos un producto');
 const store=$('#f-store').value,date=$('#f-date').value;const K=stock();
 const short=c.filter(l=>l.sku[0]!=='_'&&((K[l.sku]||{})[store]||0)<l.qty);
 if(short.length&&!confirm('Según el inventario no alcanza para:\n'+short.map(l=>'• '+l.name).join('\n')+'\n\n¿Guardar de todos modos? (luego revisa el conteo)'))return;
 const disc=cop($('#f-disc').value);const total=Math.max(0,lineTotal('sale')-disc);
 const ret=$('#f-ret').checked?Math.round(total/IVA*0.025):0;
 const r=newRec('sale',{store,date,num:saleNum(store,date),customer:$('#f-cust').value.trim(),method:$('#f-method').value,disc,total,ret,fact:$('#f-fact').value.trim(),lines:c.map(l=>({sku:l.sku,name:l.name,qty:l.qty,price:l.price,cost:(products()[l.sku]||{}).cost||0}))});
 S.carts.sale=[];showReceipt(r,true)}
function receiptText(r){return`*PVCENTRO – ${STORES[r.store]}*\nVenta ${r.num} · ${dmy(r.date)}\nCliente: ${r.customer||'Mostrador'}\n`+r.lines.map(l=>`• ${l.name} x${l.qty} = ${fmt(l.qty*l.price)}`).join('\n')+(r.disc?`\nDescuento: -${fmt(r.disc)}`:'')+`\n*TOTAL: ${fmt(r.total)}* (${r.method})`+(r.ret?`\nRetención: ${fmt(r.ret)}`:'')+(r.fact?`\nFactura electrónica: ${r.fact}`:'')+`\nVendedor: ${r.by}`}
function showReceipt(r,isNew){modal(`<h3>${isNew?'✔ Venta guardada':'Comprobante'}</h3><pre class="rc">${esc(receiptText(r))}</pre><p class="mut">Copia este texto y envíalo al grupo de WhatsApp como soporte (reemplaza el pantallazo de Tiendaná).</p><button class="b p" onclick="copyText(receiptText(db.records['${r.id}']))">Copiar para WhatsApp</button> <button class="b" onclick="closeModal();go()">Cerrar</button>`)}

/* ============ LISTA DE VENTAS ============ */
function rangeBar(extra){return`<div class="row"><label>Desde<input type="date" value="${S.from}" onchange="S.from=this.value;go()"></label><label>Hasta<input type="date" value="${S.to}" onchange="S.to=this.value;go()"></label>
 <button class="b s" onclick="S.from=S.to=todayStr();go()">Hoy</button><button class="b s" onclick="S.from=monthStart();S.to=todayStr();go()">Este mes</button>${extra||''}</div>`}
function vSales(){const st=curStore();const list=recs().filter(r=>(r.type==='sale'||r.type==='daily')&&r.date>=S.from&&r.date<=S.to&&(!st||r.store===st)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
 const tot=list.filter(r=>!r.void).reduce((a,r)=>a+r.total,0);
 return`<h2>Ventas</h2>${rangeBar(`<button class="b s" onclick="exportSales()">Descargar Excel</button>`)}<div class="card"><p><b>${fmt(tot)}</b> <span class="mut">en ${list.filter(r=>!r.void).length} registros</span></p>
 <div class="tw"><table><tr><th>Fecha</th><th>No.</th><th class="hide-s">Tienda</th><th>Cliente</th><th>Pago</th><th class="n">Total</th><th class="hide-s">Vendedor</th><th></th></tr>
 ${list.map(r=>`<tr style="${r.void?'opacity:.5;text-decoration:line-through':''}"><td>${dmy(r.date)}</td><td>${esc(r.num||'Resumen')}</td><td class="hide-s">${STORES[r.store]}</td><td>${esc(r.customer||'')}</td><td>${esc(r.method||'')}${r.type==='sale'&&r.method==='Crédito (fiado)'&&!r.void?(r.total-collected(r)>0.5?` <span class="tag v">debe ${fmt(r.total-collected(r))}</span>`:' <span class="tag">cobrado</span>'):''}</td><td class="n">${fmt(r.total)}</td><td class="hide-s">${esc(r.by)}</td>
 <td class="n">${r.type==='sale'?`<button class="b s" onclick="showReceipt(db.records['${r.id}'])">Ver</button> `:''}${!r.void&&r.type==='sale'&&r.method==='Crédito (fiado)'&&r.total-collected(r)>0.5?`<button class="b s" onclick="cobro('${r.id}')">Cobrar</button> `:''}${!r.void&&canVoid(r)?`<button class="b s d" onclick="voidRec('${r.id}')">Anular</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function canVoid(r){return U.role==='owner'||(r.store===U.store&&r.date===todayStr())}
function voidRec(id){const why=prompt('Motivo de la anulación (quedará registrado):');if(!why)return;const r=db.records[id];r.void=true;r.voidWhy=why;r.voidBy=U.name;touch(r);go()}
function cobro(id){const s=db.records[id];const deb=s.total-collected(s);modal(`<h3>Cobrar a ${esc(s.customer||'cliente')}</h3><p>Saldo: <b>${fmt(deb)}</b></p><div class="row"><label>Valor recibido<input id="c-amt" inputmode="numeric" value="${fnum(deb)}"></label><label>Medio<select id="c-met"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label></div><button class="b p" onclick="saveCobro('${id}')">Registrar cobro</button> <button class="b" onclick="closeModal()">Cancelar</button>`)}
function saveCobro(id){const s=db.records[id];const a=cop($('#c-amt').value);if(a<=0)return toast('Valor inválido');newRec('collect',{store:s.store,date:todayStr(),saleId:id,amount:a,method:$('#c-met').value});closeModal();go()}
function exportSales(){const st=curStore();const rows=[];recs().filter(r=>(r.type==='sale'||r.type==='daily')&&!r.void&&r.date>=S.from&&r.date<=S.to&&(!st||r.store===st)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
 if(r.type==='daily')rows.push([r.date,STORES[r.store],'Resumen','','','',1,r.total,r.total,'Efectivo '+(r.cash||0),'','',r.by]);else r.lines.forEach(l=>rows.push([r.date,STORES[r.store],r.num,r.customer||'',l.sku,l.name,l.qty,l.price,l.qty*l.price,r.method,r.fact||'',r.ret||0,r.by]))});
 xls('ventas_'+S.from+'_'+S.to,['Fecha','Tienda','No.','Cliente','Código','Producto','Cantidad','Precio c/IVA','Subtotal','Pago','Factura electrónica','Retención','Vendedor'],rows)}

/* ============ INVENTARIO ============ */
function vInv(){const P=products(),K=stock(),sts=visStores();const q=(S.q||'').toLowerCase();
 let list=Object.values(P).filter(p=>!q||(p.name+' '+p.sku+' '+p.cat).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'es'));
 const lim=list.length>150&&!q;if(lim)list=list.slice(0,150);
 let val=0;Object.values(P).forEach(p=>sts.forEach(s=>val+=Math.max(0,(K[p.sku]||{})[s]||0)*p.cost));
 return`<h2>Inventario</h2><div class="row"><label>Buscar<input value="${esc(S.q)}" placeholder="nombre o código" oninput="S.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{const f=document.activeElement.selectionStart;go();const i=$('#main input');i.focus();i.setSelectionRange(f,f)},250)"></label>
 ${U.role==='owner'?`<button class="b" onclick="prodForm()">+ Producto nuevo</button>`:''}<button class="b" onclick="exportInv()">Descargar Excel</button></div>
 ${U.role==='owner'?`<div class="kpi" style="margin-bottom:.8rem;display:inline-block"><small>Valor del inventario a costo</small><b>${fmt(val)}</b></div>`:''}
 <div class="card"><div class="tw"><table><tr><th>Producto</th><th class="hide-s">Categoría</th>${sts.map(s=>`<th class="n">${STORES[s]}</th>`).join('')}${U.role==='owner'?'<th class="n hide-s">Costo</th>':''}<th class="n">Precio</th><th></th></tr>
 ${list.map(p=>`<tr><td style="white-space:nowrap">${thumb(p)}<span style="display:inline-block;vertical-align:middle;white-space:normal;max-width:70%">${esc(p.name)}<br><span class="mut" style="font-size:.75rem">${esc(p.sku)}</span></span></td><td class="hide-s">${esc(p.cat)}</td>${sts.map(s=>{const v=(K[p.sku]||{})[s]||0;return`<td class="n ${v<0?'bad':p.min>0&&v<=p.min?'bad':''}">${fnum(v)}</td>`}).join('')}${U.role==='owner'?`<td class="n hide-s">${fmt(p.cost)}</td>`:''}<td class="n">${fmt(p.price)}</td>
 <td class="n"><button class="b s" onclick="adjForm('${p.sku}')">Contar</button>${U.role==='owner'?` <button class="b s" onclick="prodForm('${p.sku}')">Editar</button>`:''}</td></tr>`).join('')}</table></div>${lim?'<p class="mut">Mostrando 150. Usa el buscador para ver el resto.</p>':''}</div>`}
function exportInv(){const P=products(),K=stock(),o=U.role==='owner';xls('inventario_'+todayStr(),['Código','Producto','Categoría','Unidad',...(o?['Costo c/IVA']:[]),'Precio c/IVA','Stock San Gil','Stock Socorro',...(o?['Valor a costo']:[])],Object.values(P).map(p=>{const k=K[p.sku]||{};return[p.sku,p.name,p.cat,p.unit,...(o?[p.cost]:[]),p.price,k.sangil||0,k.socorro||0,...(o?[((k.sangil||0)+(k.socorro||0))*p.cost]:[])]}))}
function adjForm(sku){const p=products()[sku],K=(stock()[sku]||{});const st=visStores();
 modal(`<h3>Conteo físico</h3><p>${esc(p.name)}</p><div class="row">${st.map(s=>`<label>${STORES[s]} (sistema: ${fnum(K[s]||0)})<input type="number" step="0.01" id="adj-${s}" placeholder="contado"></label>`).join('')}</div><label>Nota<input id="adj-n" placeholder="motivo (opcional)" style="width:100%"></label><br><br><button class="b p" onclick="saveAdj('${sku}')">Guardar ajuste</button> <button class="b" onclick="closeModal()">Cancelar</button>`)}
function saveAdj(sku){const p=products()[sku],K=stock()[sku]||{};let n=0;visStores().forEach(s=>{const v=$('#adj-'+s).value;if(v==='')return;const delta=Number(v)-(K[s]||0);if(Math.abs(delta)>1e-9){newRec('adjust',{store:s,date:todayStr(),sku,name:p.name,delta,note:$('#adj-n').value});n++}});closeModal();toast(n?'Ajuste guardado':'Sin diferencias');go()}
function prodForm(sku){const p=sku?products()[sku]:{sku:'',name:'',cat:'Otros',unit:'Unidad',cost:0,price:0,min:0,iva:.19};const cats=[...new Set(Object.values(products()).map(x=>x.cat))].sort();
 modal(`<h3>${sku?'Editar':'Nuevo'} producto</h3><div class="row"><label>Código<input id="pf-sku" value="${esc(p.sku)}" ${sku?'disabled':''} placeholder="automático si lo dejas vacío"></label><label style="flex:1">Nombre<input id="pf-name" value="${esc(p.name)}"></label></div>
 <div class="row"><label>Categoría<input id="pf-cat" list="cats" value="${esc(p.cat)}"><datalist id="cats">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></label><label>Unidad<input id="pf-unit" value="${esc(p.unit)}" style="width:90px"></label></div>
 <div class="row"><label>Costo c/IVA<input id="pf-cost" inputmode="numeric" value="${fnum(p.cost)}"></label><label>Precio c/IVA<input id="pf-price" inputmode="numeric" value="${fnum(p.price)}"></label><label>Stock mínimo<input id="pf-min" type="number" value="${p.min||0}" style="width:90px"></label></div>
 <div class="row"><label style="flex:1">Enlace de la foto (opcional)<input id="pf-img" value="${esc(p.img||'')}" placeholder="https://…" style="width:100%"></label></div>
 <button class="b p" onclick="saveProd('${sku||''}')">Guardar</button> <button class="b" onclick="closeModal()">Cancelar</button>`)}
function saveProd(sku){let k=sku||$('#pf-sku').value.trim().replace(/[^A-Za-z0-9_-]/g,'');if(!k)k='N'+Date.now().toString(36).toUpperCase();const name=$('#pf-name').value.trim();if(!name)return toast('Falta el nombre');if(!sku&&products()[k])return toast('Ya existe ese código');
 const data={sku:k,name,cat:$('#pf-cat').value.trim()||'Otros',unit:$('#pf-unit').value.trim()||'Unidad',cost:cop($('#pf-cost').value),price:cop($('#pf-price').value),min:Number($('#pf-min').value)||0,iva:.19,img:$('#pf-img').value.trim()};
 const id='P'+k;db.records[id]={id,type:'product',sku:k,store:'sangil',date:todayStr(),by:U.name,ts:Date.now(),data};save();closeModal();go()}

/* ============ COMPRAS ============ */
function vBuy(){setTimeout(()=>drawLines('buy'),0);
 const list=recs().filter(r=>r.type==='purchase'&&inScope(r)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
 return`<h2>Compras / entrada de mercancía</h2><div class="card"><div class="row">${storeSel('f-store')}${dateInp('f-date')}<label>Proveedor<input id="f-sup"></label><label>No. factura<input id="f-fact"></label>
 <label>Pago<select id="f-method">${['Efectivo','Transferencia','Crédito proveedor'].map(m=>`<option>${m}</option>`).join('')}</select></label></div>
 <label style="font-size:.9rem"><input type="checkbox" id="f-upd" checked> Actualizar el costo del producto con este costo</label></div>
 ${(()=>{const pend=recs().filter(r=>r.type==='purchase'&&r.pending&&!r.void);return pend.length?`<div class="card" style="border-color:var(--warn)"><h3>Recepciones pendientes de costo (${pend.length})</h3><p class="mut">Las registraron los vendedores sin valores.</p><table>${pend.map(r=>`<tr><td>${dmy(r.date)}</td><td>${STORES[r.store]}</td><td>${esc(r.supplier||'')} · ${r.lines.length} productos · ${esc(r.by)}</td><td class="n"><button class="b s p" onclick="costRecv('${r.id}')">Poner costos</button></td></tr>`).join('')}</table></div>`:''})()}
 ${lineEditor('buy')}<div class="card"><div class="row"><div id="tot-buy"></div><span style="flex:1"></span><button class="b p" onclick="saveBuy()">Guardar compra</button></div></div>
 <div class="card"><h3>Últimas compras</h3><div class="tw"><table><tr><th>Fecha</th><th>Tienda</th><th>Proveedor</th><th class="n">Total</th><th></th></tr>${list.map(r=>`<tr style="${r.void?'opacity:.5;text-decoration:line-through':''}"><td>${dmy(r.date)}</td><td>${STORES[r.store]}</td><td>${esc(r.supplier)} ${esc(r.fact||'')}</td><td class="n">${fmt(r.total)}</td><td>${!r.void&&U.role==='owner'?`<button class="b s d" onclick="voidRec('${r.id}')">Anular</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function saveBuy(){const c=S.carts.buy;if(!c.length)return toast('Agrega productos');const store=$('#f-store').value;const total=lineTotal('buy');
 newRec('purchase',{store,date:$('#f-date').value,supplier:$('#f-sup').value.trim(),fact:$('#f-fact').value.trim(),method:$('#f-method').value,total,ret:Math.round(total/IVA*0.025),lines:c.map(l=>({sku:l.sku,name:l.name,qty:l.qty,cost:l.price}))});
 if($('#f-upd').checked&&U.role==='owner'){c.forEach(l=>{const p=products()[l.sku];if(p.cost!==l.price){const id='P'+l.sku;db.records[id]={id,type:'product',sku:l.sku,store:'sangil',date:todayStr(),by:U.name,ts:Date.now(),data:Object.assign({},p,{cost:l.price})}}});save()}
 S.carts.buy=[];toast('Compra guardada: entró al inventario');go()}

/* ============ RECIBIR MERCANCÍA (vendedores: solo cantidades, sin costos) ============ */
function vRecv(){setTimeout(()=>drawLines('recv'),0);
 const list=recs().filter(r=>r.type==='purchase'&&r.store===U.store).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).slice(0,15);
 return`<h2>Recibir mercancía</h2><p class="mut">Registra solo lo que llegó (producto y cantidad). Los valores los completa el propietario.</p>
 <div class="card"><div class="row">${storeSel('f-store')}${dateInp('f-date')}<label>Proveedor / origen<input id="f-sup" placeholder="quién la envía"></label><label>No. remisión o guía<input id="f-fact"></label></div></div>
 ${lineEditor('recv')}<div class="card"><div class="row"><div id="tot-recv"></div><span style="flex:1"></span><button class="b p" onclick="saveRecv()">Guardar recepción</button></div></div>
 <div class="card"><h3>Últimas recepciones</h3><div class="tw"><table><tr><th>Fecha</th><th>Proveedor</th><th>Productos</th><th></th></tr>${list.map(r=>`<tr style="${r.void?'opacity:.5;text-decoration:line-through':''}"><td>${dmy(r.date)}</td><td>${esc(r.supplier||'')} ${esc(r.fact||'')}</td><td>${r.lines.map(l=>esc(l.name)+' x'+l.qty).join(', ')}</td><td>${!r.void&&r.date===todayStr()?`<button class="b s d" onclick="voidRec('${r.id}')">Anular</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function saveRecv(){const c=S.carts.recv;if(!c.length)return toast('Agrega productos');const store=U.store;
 const r=newRec('purchase',{store,date:$('#f-date').value,supplier:$('#f-sup').value.trim(),fact:$('#f-fact').value.trim(),method:'Pendiente',total:0,ret:0,pending:true,recv:true,lines:c.map(l=>({sku:l.sku,name:l.name,qty:l.qty,cost:0}))});
 S.carts.recv=[];const txt=`*PVCENTRO – ${STORES[store]}*\nRecepción de mercancía · ${dmy(r.date)}\n${r.supplier?'Origen: '+r.supplier+'\n':''}`+r.lines.map(l=>`• ${l.name} x${l.qty}`).join('\n')+`\nRecibió: ${r.by}`;
 modal(`<h3>✔ Recepción guardada</h3><pre class="rc">${esc(txt)}</pre><p class="mut">Entró al inventario. Copia este texto al grupo de WhatsApp como soporte.</p><button class="b p" onclick="copyText(${JSON.stringify(txt).replace(/"/g,'&quot;')})">Copiar para WhatsApp</button> <button class="b" onclick="closeModal();go()">Cerrar</button>`)}
function costRecv(id){const r=db.records[id];const P=products();
 modal(`<h3>Poner costos a la recepción</h3><p class="mut">${esc(r.supplier||'')} · ${dmy(r.date)} · ${STORES[r.store]} · recibió ${esc(r.by)}</p><div class="tw" style="max-height:50vh"><table><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Costo unit. c/IVA</th></tr>${r.lines.map((l,i)=>`<tr><td>${esc(l.name)}</td><td class="n">${fnum(l.qty)}</td><td class="n"><input id="cr-${i}" inputmode="numeric" value="${fnum(l.cost||(P[l.sku]||{}).cost||0)}" style="width:110px;text-align:right"></td></tr>`).join('')}</table></div>
 <div class="row" style="margin-top:.6rem"><label>No. factura<input id="cr-f" value="${esc(r.fact||'')}"></label><label>Pago<select id="cr-m"><option>Efectivo</option><option>Transferencia</option><option>Crédito proveedor</option></select></label></div><label style="font-size:.9rem"><input type="checkbox" id="cr-u" checked> Actualizar el costo de los productos</label><br><br>
 <button class="b p" onclick="saveCost('${id}')">Guardar costos</button> <button class="b" onclick="closeModal()">Cancelar</button>`)}
function saveCost(id){const r=db.records[id];let total=0;r.lines.forEach((l,i)=>{l.cost=cop($('#cr-'+i).value);total+=l.qty*l.cost});
 r.total=total;r.ret=Math.round(total/IVA*0.025);r.fact=$('#cr-f').value.trim();r.method=$('#cr-m').value;r.pending=false;
 if($('#cr-u').checked){r.lines.forEach(l=>{const p=products()[l.sku];if(p&&p.cost!==l.cost&&l.cost>0){const pid='P'+l.sku;db.records[pid]={id:pid,type:'product',sku:l.sku,store:'sangil',date:todayStr(),by:U.name,ts:Date.now(),data:Object.assign({},p,{cost:l.cost})}}})}
 touch(r);closeModal();toast('Costos guardados');go()}

/* ============ GASTOS ============ */
function vExp(){const st=curStore();const list=recs().filter(r=>r.type==='expense'&&r.date>=S.from&&r.date<=S.to&&(!st||r.store===st)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
 return`<h2>Gastos</h2><div class="card"><div class="row">${storeSel('e-store')}${dateInp('e-date')}<label>Categoría<select id="e-cat">${CATS_EXP.map(c=>`<option>${c}</option>`).join('')}</select></label>
 <label>Descripción<input id="e-desc" style="min-width:180px"></label><label>Valor<input id="e-amt" inputmode="numeric" style="width:120px"></label><label>Pago<select id="e-met"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label>
 <button class="b p" onclick="saveExp()">Guardar</button></div></div>

 ${list.map(r=>`<tr style="${r.void?'opacity:.5;text-decoration:line-through':''}"><td>${dmy(r.date)}</td><td>${STORES[r.store]}</td><td>${esc(r.cat)}</td><td>${esc(r.desc)} <span class="mut">${esc(r.method)}</span></td><td class="n">${fmt(r.amount)}</td><td>${!r.void&&canVoid(r)?`<button class="b s d" onclick="voidRec('${r.id}')">Anular</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function saveExp(){const a=cop($('#e-amt').value);if(a<=0)return toast('Falta el valor');newRec('expense',{store:$('#e-store').value,date:$('#e-date').value,cat:$('#e-cat').value,desc:$('#e-desc').value.trim(),amount:a,method:$('#e-met').value});toast('Gasto guardado');go()}

/* ============ TRASLADOS ============ */
function vTrans(){setTimeout(()=>drawLines('trans'),0);const o=U.role==='owner';const list=recs().filter(r=>r.type==='transfer'&&inScope(r)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
 return`<h2>Traslados entre tiendas</h2><div class="card"><div class="row">${dateInp('t-date')}<label>Sale de<select id="f-from" onchange="const o=this.value==='sangil'?'socorro':'sangil';$('#t-to').value=o">${Object.entries(STORES).map(([k,v])=>`<option value="${k}" ${(o?'sangil':U.store)===k?'selected':''}>${v}</option>`).join('')}</select></label>
 <label>Llega a<select id="t-to">${Object.entries(STORES).map(([k,v])=>`<option value="${k}" ${k===((o?'sangil':U.store)==='sangil'?'socorro':'sangil')?'selected':''}>${v}</option>`).join('')}</select></label><label>Nota<input id="t-note"></label></div></div>
 ${lineEditor('trans')}<div class="card"><div class="row"><div id="tot-trans"></div><span style="flex:1"></span><button class="b p" onclick="saveTrans()">Guardar traslado</button></div></div>
 <div class="card"><h3>Últimos traslados</h3><div class="tw"><table><tr><th>Fecha</th><th>Ruta</th><th>Productos</th><th></th></tr>${list.map(r=>`<tr style="${r.void?'opacity:.5;text-decoration:line-through':''}"><td>${dmy(r.date)}</td><td>${STORES[r.from]} → ${STORES[r.to]}</td><td>${r.lines.map(l=>esc(l.name)+' x'+l.qty).join(', ')}</td><td>${!r.void&&U.role==='owner'?`<button class="b s d" onclick="voidRec('${r.id}')">Anular</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function saveTrans(){const c=S.carts.trans;if(!c.length)return toast('Agrega productos');const from=$('#f-from').value,to=$('#t-to').value;if(from===to)return toast('Origen y destino son iguales');
 newRec('transfer',{from,to,store:from,date:$('#t-date').value,note:$('#t-note').value,lines:c.map(l=>({sku:l.sku,name:l.name,qty:l.qty}))});S.carts.trans=[];toast('Traslado guardado');go()}

/* ============ CAJA ============ */
function vCash(){const st=curStore()||U.store||'sangil';const d=S.cashDate||todayStr();const c=cashDay(st,d);const cl=db.records['CL-'+st+'-'+d];
 const s=agg(d,d,st);const stOpts=U.role==='owner'?`<label>Tienda<select onchange="S.store=this.value;go()">${Object.entries(STORES).map(([k,v])=>`<option value="${k}" ${st===k?'selected':''}>${v}</option>`).join('')}</select></label>`:'';
 return`<h2>Cierre de caja</h2><div class="row">${stOpts}<label>Fecha<input type="date" value="${d}" onchange="S.cashDate=this.value;go()"></label></div>
 <div class="card"><table style="max-width:460px"><tr><td>Ventas en efectivo</td><td class="n">${fmt(c.ventas)}</td></tr><tr><td>Cobros de crédito en efectivo</td><td class="n">${fmt(c.cobros)}</td></tr><tr><td>− Gastos en efectivo</td><td class="n">${fmt(c.gastos)}</td></tr><tr><td>− Compras en efectivo</td><td class="n">${fmt(c.compras)}</td></tr><tr><td><b>Efectivo esperado en caja</b></td><td class="n"><b>${fmt(c.esperado)}</b></td></tr></table>
 <p class="mut">Ventas totales del día: ${fmt(s.ventas)} ${Object.entries(s.byMethod).map(([k,v])=>`· ${k}: ${fmt(v)}`).join(' ')}</p>
 <div class="row"><label>Efectivo contado<input id="cl-c" inputmode="numeric" value="${cl?fnum(cl.counted):''}" oninput="const d=cop(this.value)-${c.esperado};$('#cl-d').textContent=this.value?fmtDiff(d):''"></label><label>Nota<input id="cl-n" value="${esc(cl?cl.note:'')}"></label><button class="b p" onclick="saveClose('${st}','${d}',${c.esperado})">Guardar cierre</button></div>
 <p id="cl-d">${cl?fmtDiff(cl.counted-cl.expected):''}</p></div>
 <div class="card"><h3>Cierres recientes</h3><table><tr><th>Fecha</th><th>Tienda</th><th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferencia</th></tr>${recs().filter(r=>r.type==='close'&&inScope(r)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(r=>`<tr><td>${dmy(r.date)}</td><td>${STORES[r.store]}</td><td class="n">${fmt(r.expected)}</td><td class="n">${fmt(r.counted)}</td><td class="n ${r.counted-r.expected<0?'bad':''}">${fmt(r.counted-r.expected)}</td></tr>`).join('')}</table></div>`}
function fmtDiff(d){return Math.abs(d)<1?'<span class="ok">Cuadra ✔</span>':d<0?`<span class="bad">Faltan ${fmt(-d)}</span>`:`<span class="ok">Sobran ${fmt(d)}</span>`}
function saveClose(st,d,exp){const id='CL-'+st+'-'+d;db.records[id]={id,type:'close',store:st,date:d,expected:exp,counted:cop($('#cl-c').value),note:$('#cl-n').value,by:U.name,ts:Date.now()};save();toast('Cierre guardado');go()}

/* ============ REPORTES (propietario) ============ */
function monthRows(){const out={};const now=todayStr().slice(0,7);EXT().hist.forEach(h=>{(out[h.ym]=out[h.ym]||{sangil:0,socorro:0,hist:{sangil:0,socorro:0},app:{sangil:0,socorro:0}});out[h.ym][h.store]+=h.total;out[h.ym].hist[h.store]+=h.total});
 recs().forEach(r=>{if(r.void||(r.type!=='sale'&&r.type!=='daily'))return;const m=ymOf(r.date);const o=out[m]=out[m]||{sangil:0,socorro:0,hist:{sangil:0,socorro:0},app:{sangil:0,socorro:0}};o[r.store]+=r.total;o.app[r.store]+=r.total});
 return Object.entries(out).sort((a,b)=>a[0].localeCompare(b[0]))}
function vRep(){const st=curStore();const a=agg(S.from,S.to,st);const top={};
 recs().forEach(r=>{if(r.type!=='sale'||r.void||r.date<S.from||r.date>S.to||(st&&r.store!==st))return;r.lines.forEach(l=>{const t=top[l.sku]=top[l.sku]||{name:l.name,q:0,v:0,c:0};t.q+=l.qty;t.v+=l.qty*l.price;t.c+=l.qty*(l.cost||(products()[l.sku]||{}).cost||0)})});
 const tl=Object.values(top).sort((x,y)=>y.v-x.v).slice(0,10);const mr=monthRows();const mx=Math.max(1,...mr.map(m=>m[1].sangil+m[1].socorro));
 const ivaPag=a.iva-a.ivaC;
 return`<h2>Reportes</h2>${rangeBar(`<button class="b s" onclick="exportRep()">Descargar Excel</button>`)}
 <div class="grid" style="margin-bottom:1rem"><div class="kpi"><small>Ventas (con IVA)</small><b>${fmt(a.ventas)}</b><small>${a.n} facturas/ventas</small></div><div class="kpi"><small>Utilidad bruta (sin IVA)</small><b>${fmt(a.utilidad)}</b><small>Margen ${pct(a.neto?a.utilidad/a.neto:0)}</small></div>
 <div class="kpi"><small>Gastos</small><b>${fmt(a.gastos)}</b></div><div class="kpi"><small>Resultado operativo</small><b class="${a.operativa<0?'bad':'ok'}">${fmt(a.operativa)}</b><small>antes de intereses/impuesto de renta si no están en gastos</small></div></div>
 <div class="card"><h3>IVA y retenciones del período (estimado)</h3><table style="max-width:520px"><tr><td>IVA generado en ventas</td><td class="n">${fmt(a.iva)}</td></tr><tr><td>IVA descontable en compras registradas</td><td class="n">${fmt(a.ivaC)}</td></tr><tr><td><b>IVA a pagar estimado</b></td><td class="n"><b>${fmt(ivaPag)}</b></td></tr><tr><td>Retención en la fuente que te practicaron (ventas)</td><td class="n">${fmt(a.ret)}</td></tr></table><p class="mut">Estimado con lo registrado en la app. El IVA se declara cada cuatrimestre; confírmalo con el contador antes de pagar.</p></div>
 <div class="card"><h3>Ventas por mes (San Gil + Socorro)</h3><div class="tw" style="max-height:none"><table><tr><th>Mes</th><th class="n">San Gil</th><th class="n">Socorro</th><th class="n">Total</th><th style="width:30%"></th></tr>${mr.map(([m,o])=>`<tr><td>${m}</td><td class="n">${fmt(o.sangil)}</td><td class="n ${o.socorro===0?'bad':''}">${fmt(o.socorro)}</td><td class="n"><b>${fmt(o.sangil+o.socorro)}</b></td><td><div class="bar" style="width:${(o.sangil+o.socorro)/mx*100}%"></div></td></tr>`).join('')}</table></div><p class="mut">Los meses anteriores a la app vienen de los reportes de Tiendaná. Un valor $0 en rojo en Socorro significa que ese mes no se registró.</p></div>
 <div class="grid"><div class="card"><h3>Gastos por categoría</h3><table>${Object.entries(a.byExp).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join('')||'<tr><td class="mut">Sin gastos</td></tr>'}</table></div>
 <div class="card"><h3>Ventas por forma de pago</h3><table>${Object.entries(a.byMethod).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join('')||'<tr><td class="mut">Sin ventas</td></tr>'}</table></div></div>
 <div class="card"><h3>10 productos más vendidos (valor)</h3><table><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Ventas</th><th class="n">Margen</th></tr>${tl.map(t=>`<tr><td>${esc(t.name)}</td><td class="n">${fnum(t.q)}</td><td class="n">${fmt(t.v)}</td><td class="n">${pct(t.v?(t.v-t.c)/t.v:0)}</td></tr>`).join('')||'<tr><td class="mut">Sin ventas con detalle</td></tr>'}</table></div>`}
function exportRep(){const rows=monthRows().map(([m,o])=>[m,o.sangil,o.socorro,o.sangil+o.socorro]);xls('ventas_por_mes',['Mes','San Gil','Socorro','Total'],rows)}

/* ============ SINCRONIZAR / RESPALDO ============ */
function resumenDia(){const d=todayStr();const lines=[`*Cierre ${dmy(d)}*`];visStores().forEach(s=>{const a=agg(d,d,s),c=cashDay(s,d);lines.push(`${STORES[s]}: ventas ${fmt(a.ventas)} (${a.n}) · gastos ${fmt(a.gastos)} · efectivo esperado ${fmt(c.esperado)}`)});return lines.join('\n')}
function vSync(){const pend=recs().filter(r=>r.ts>db.lastExport).length;const dd=db.lastExport?new Date(db.lastExport).toLocaleString('es-CO'):'nunca';
 const cl=db.cloud||{};
 return`<h2>Nube (Google Sheets)</h2><div class="card"><p>Con la nube, lo que se registra en una tienda aparece en la otra en segundos cuando hay internet, y sin internet todo sigue funcionando y se envía después. ${U.role==='owner'?'Tú ves todo; los vendedores solo reciben lo de su tienda y sin costos.':'Solo ves lo de tu tienda.'}</p>
 <div class="row"><label style="flex:1;min-width:240px">Dirección de la nube (termina en /exec)<input id="cl-u" value="${esc(cl.url||'')}" style="width:100%" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Mi clave<input id="cl-t" type="password" value="${esc(cl.token||'')}"></label></div>
 <div class="row"><button class="b p" onclick="saveCloud()">Guardar y sincronizar</button><button class="b" onclick="cloudSync(true)">Sincronizar ahora</button></div>
 <p class="mut" id="cl-st">${cl.last?'Última sincronización: '+new Date(cl.last).toLocaleString('es-CO'):'Aún no sincronizada'}${cl.err?' · último error: '+esc(cl.err):''}</p>
 ${U.role==='owner'?`<h3 style="margin-top:1rem">Enlace de configuración para un vendedor</h3><p class="mut">Pega la clave de Wilmer o de Darío (pestaña Claves de tu hoja), genera el enlace y envíaselo por WhatsApp: al abrirlo en su celular queda configurado.</p><div class="row"><label style="flex:1">Clave de esa persona<input id="cl-k2" style="width:100%"></label><button class="b" onclick="magicLink()">Generar y copiar enlace</button></div><input id="cl-link" readonly style="width:100%" placeholder="el enlace aparece aquí">`:''}</div>
 <h2>Sincronizar sin la nube (por archivo)</h2><div class="card"><p>Cada tienda trabaja con su propia copia, <b>sin internet</b>. Al cerrar el día, el vendedor envía su archivo por WhatsApp a Edison, y Edison importa los archivos de las dos tiendas. Si Edison cambia precios o crea productos, envía su archivo a los vendedores y ellos lo importan.</p>
 <p class="mut">Último envío: ${dd}${U.role==='owner'?'':` · Movimientos sin enviar: <b>${pend}</b>`}</p>
 <div class="row"><button class="b p" onclick="exportSync()">1. Generar archivo de cierre</button><button class="b" onclick="copyText(resumenDia())">Copiar resumen del día (texto)</button></div>
 <div class="row"><label>2. Recibir el archivo de otra persona<input type="file" accept=".json,application/json" onchange="importFile(this.files[0],'sync')"></label></div>
 <div class="row"><label>Cargar catálogo inicial (existencias${U.role==='owner'?' y costos':''}) · se hace una sola vez<input type="file" accept=".json,application/json" onchange="importFile(this.files[0],'sync')"></label></div></div>
 <h2>Copia de seguridad</h2><div class="card"><p>Descarga una copia completa y guárdala en Google Drive, memoria USB o envíala a tu correo. Si el computador falla, con este archivo recuperas todo.</p><p class="mut">Última copia: ${db.lastBackup?new Date(db.lastBackup).toLocaleString('es-CO'):'nunca'}</p>
 <div class="row"><button class="b p" onclick="exportBackup()">Descargar copia de seguridad</button><label>Restaurar desde copia<input type="file" accept=".json" onchange="importFile(this.files[0],'backup')"></label></div></div>`}
function exportSync(){if(U.role!=='owner')return doExport(null);
 modal(`<h3>¿Para quién es el archivo?</h3><p class="mut">Los archivos para vendedores salen <b>sin costos, sin gastos y sin ventas de la otra tienda</b>.</p>
 <button class="b p" style="width:100%;margin:.3rem 0" onclick="closeModal();doExport('sangil')">Wilmer (San Gil)</button><button class="b p" style="width:100%;margin:.3rem 0" onclick="closeModal();doExport('socorro')">Darío (Socorro)</button><button class="b" style="width:100%;margin:.3rem 0" onclick="closeModal();doExport('full')">Copia completa (solo para mí / contador)</button>`)}
function cleanFor(r,tg){if(tg==='full'||!tg)return r;const c=JSON.parse(JSON.stringify(r));
 if(r.type==='product'){c.data.cost=0;return c}
 if(r.type==='transfer'||r.type==='adjust')return c;
 if((r.type==='purchase'||r.type==='sale')&&r.store===tg){c.lines.forEach(l=>l.cost=0);if(r.type==='purchase'){c.total=0;c.ret=0}return c}
 return null}
async function doExport(tg){db.lastExportT=db.lastExportT||{};const since=U.role==='owner'?(db.lastExportT[tg]||0):db.lastExport;
 const recsOut=recs().filter(r=>r.ts>since).map(r=>cleanFor(r,tg)).filter(Boolean);const payload={app:'pvcentro',kind:'sync',from:U.name,store:U.store||'owner',for:tg||U.store,at:Date.now(),records:recsOut};
 const mark=()=>{if(U.role==='owner')db.lastExportT[tg]=Date.now();else db.lastExport=Date.now();save()};
 const name=`pvcentro_${U.store?'cierre_'+STORES[U.store].replace(' ',''):'para_'+(tg==='full'?'completo':STORES[tg].replace(' ',''))}_${todayStr()}.json`;const text=JSON.stringify(payload);
 try{const f=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cierre PVCENTRO'});mark();toast('Enviado');return go()}}catch(e){if(e&&e.name==='AbortError')return}
 download(name,text);mark();toast(recsOut.length+' movimientos en el archivo. Envíalo por WhatsApp como documento.');setTimeout(go,300)}
function exportBackup(){download(`pvcentro_RESPALDO_${todayStr()}.json`,JSON.stringify({app:'pvcentro',kind:'backup',db}));db.lastBackup=Date.now();save();toast('Copia descargada');go()}
function importFile(f,mode){if(!f)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(e){return toast('El archivo no se pudo leer')}
 if(o.app!=='pvcentro')return toast('Este archivo no es de PVCENTRO');
 if(o.kind==='catalog'){db.ext=o.ext;save();modal(`<h3>✔ Catálogo cargado</h3><p>${Object.keys(o.ext.stock).length} productos con existencias${Object.keys(o.ext.costs).length?' y costos':''}.</p><button class="b p" onclick="closeModal();go()">Aceptar</button>`);return}
 if(o.kind==='backup'){if(mode!=='backup')return toast('Ese es un respaldo; usa "Restaurar desde copia"');if(!confirm('Esto REEMPLAZA todos los datos de este equipo por los del respaldo. ¿Continuar?'))return;const keep=U.id;db=o.db;save();saveNow().then(()=>{U=Object.assign({id:keep},db.users[keep]);toast('Respaldo restaurado');go()});return}
 if(mode==='backup')return toast('Ese es un archivo de cierre; usa "Recibir el archivo"');
 let nu=0,up=0;(o.records||[]).forEach(r=>{const e=db.records[r.id];if(!e){db.records[r.id]=r;nu++}else if(r.ts>e.ts){db.records[r.id]=r;up++}});save();
 modal(`<h3>✔ Archivo recibido de ${esc(o.from)}</h3><p>${nu} movimientos nuevos y ${up} actualizados.</p><button class="b p" onclick="closeModal();go()">Aceptar</button>`)};rd.readAsText(f)}

/* ============ AJUSTES (propietario) ============ */
function vSet(){return`<h2>Ajustes</h2>
 <div class="card"><h3>Cargar ventas diarias de una tienda (resumen)</h3><p class="mut">Para meter las ventas que ya existen en el Excel de Darío (septiembre y octubre) sin digitar factura por factura. Pega una línea por día: <b>fecha ; total ; efectivo (opcional)</b>. Ejemplo: <code>15/09/2026;1250000;800000</code></p>
 <div class="row">${storeSel('b-store','socorro')}</div><textarea id="b-txt" rows="7" style="width:100%" placeholder="15/09/2026;1250000;800000&#10;16/09/2026;980000"></textarea><br><br><button class="b p" onclick="bulkDaily()">Cargar resumen diario</button></div>
 <div class="card"><h3>Parámetros</h3><div class="row"><label>Margen estimado para resúmenes sin detalle<input id="s-m" value="${(db.estMargin*100).toFixed(1)}" style="width:90px"> %</label><button class="b" onclick="db.estMargin=Math.min(.95,Math.max(.05,(Number($('#s-m').value)||51.9)/100));save();toast('Guardado')">Guardar</button></div></div>
 <div class="card"><h3>Claves de usuarios</h3><p class="mut">Cada equipo guarda sus propias claves. Si alguien olvida la suya, bórrala aquí y creará una nueva.</p>${Object.entries(db.users).map(([k,u])=>`<div class="row"><span style="min-width:120px">${esc(u.name)}</span><button class="b s" onclick="db.users['${k}'].pin='';save();toast('Clave borrada: ${esc(u.name)} creará una nueva al entrar')">Borrar clave</button></div>`).join('')}</div>
 <div class="card"><h3>Acerca de</h3><p class="mut">Los datos viven solo en este navegador y en tus copias de seguridad. Para la facturación electrónica DIAN sigue usando Facturatech; aquí solo anotas el número de factura.</p></div>`}
function bulkDaily(){const store=$('#b-store').value;let n=0,bad=[];$('#b-txt').value.split('\n').forEach(line=>{line=line.trim();if(!line)return;const p=line.split(/[;\t]/);const d=parseDate(p[0]);const t=cop(p[1]);if(!d||t<=0){bad.push(line);return}
 const id='D-'+store+'-'+d;db.records[id]={id,type:'daily',store,date:d,total:t,cash:p[2]?cop(p[2]):0,by:U.name,ts:Date.now(),note:'resumen cargado'};n++});save();toast(n+' días cargados'+(bad.length?'. No se entendieron: '+bad.join(' | '):''));if(!bad.length)$('#b-txt').value=''}

boot();
</script>
