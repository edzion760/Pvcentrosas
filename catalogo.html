const P=D.map(a=>({sku:a[0],name:a[1],cat:a[2],unit:a[3],price:a[4],cloud:a[5]}));
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const COP=n=>n>0?'$'+Math.round(n).toLocaleString('es-CO'):'Consultar precio';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const cats=[...new Set(P.map(p=>p.cat))];
let cat='',lim=60,cur=null,pushed=false;
function ini(p){return esc(p.name.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g,'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase())}
function img(p,big){
  const loc='imagenes/productos/'+p.sku+'.webp';
  const f="if(!this.dataset.t&&'"+p.cloud+"'){this.dataset.t=1;this.src='"+p.cloud+"'}else{this.parentNode.textContent='"+ini(p)+"'}";
  return '<img loading="'+(big?'eager':'lazy')+'" alt="'+esc(p.name)+'" src="'+loc+'" onerror="'+f+'">';
}
function link(p){return BASE+'catalogo.html?p='+p.sku}
function msg(p){return 'Hola PVCENTRO, me interesa: '+p.name+(p.price>0?' ('+COP(p.price)+')':'')+'. Ref. '+p.sku+'\n'+link(p)}
function waUrl(t){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(t)}
function list(){
  const q=norm($('#q').value).trim().split(/\s+/).filter(Boolean);
  return P.filter(p=>(!cat||p.cat===cat)&&q.every(w=>norm(p.name+' '+p.cat+' '+p.sku).includes(w)));
}
function chips(){
  $('#chips').innerHTML='<button class="'+(cat?'':'on')+'" data-c="">Todos<span>'+P.length+'</span></button>'+
   cats.map(c=>'<button class="'+(cat===c?'on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'<span>'+P.filter(p=>p.cat===c).length+'</span></button>').join('');
}
function draw(){
  const L=list();const shown=L.slice(0,lim);
  $('#info').textContent=L.length+' producto'+(L.length===1?'':'s')+(cat?' en '+cat:'')+' · toca uno para ver foto y pedirlo';
  $('#grid').innerHTML=shown.length?shown.map(p=>'<button class="pc" data-s="'+p.sku+'"><div class="ph">'+img(p)+'</div><div class="pb"><div class="pn">'+esc(p.name)+'</div><div class="pp">'+COP(p.price)+'</div><div class="pu">'+esc(p.unit)+(p.price>0?' · IVA incl.':'')+'</div></div></button>').join('')+(L.length>lim?'<button class="pc" id="more" style="align-items:center;justify-content:center;min-height:120px;color:var(--pri);font-weight:700">Ver más…</button>':''):'<div class="empty">No encontramos ese producto. Escríbenos por WhatsApp y te ayudamos.</div>';
}
function openP(sku,push){
  const p=P.find(x=>x.sku===sku);if(!p)return;cur=p;
  $('#sheet').innerHTML='<button class="x" onclick="closeP()" aria-label="Cerrar">✕</button><div class="big">'+img(p,1)+'</div><h2>'+esc(p.name)+'</h2><div class="cat">'+esc(p.cat)+' · '+esc(p.unit)+' · Ref. '+p.sku+'</div><div class="price">'+COP(p.price)+'</div><div class="cat">'+(p.price>0?'IVA incluido':'Escríbenos para cotizar')+'</div><div class="row"><a class="wa" target="_blank" rel="noopener" href="'+waUrl(msg(p))+'">Pedir por WhatsApp</a><button class="btn2" onclick="share()">Compartir</button></div>';
  $('#m').classList.add('open');document.body.style.overflow='hidden';
  if(push){history.pushState({p:sku},'','?p='+sku);pushed=true}
}
function closeP(){if(pushed){history.back()}else hide()}
function hide(){$('#m').classList.remove('open');document.body.style.overflow='';cur=null;pushed=false}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',1800)}
async function share(){if(!cur)return;const u=link(cur);
  if(navigator.share){try{await navigator.share({title:cur.name,text:cur.name+' · PVCENTRO',url:u});return}catch(e){}}
  try{await navigator.clipboard.writeText(u);toast('Enlace copiado')}catch(e){prompt('Copia este enlace:',u)}}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='more'){lim+=60;draw();return}if(b.dataset.s)openP(b.dataset.s,true)});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;lim=60;chips();draw();sync()});
$('#q').addEventListener('input',()=>{lim=60;draw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#m').classList.contains('open'))closeP()});
window.addEventListener('popstate',()=>{const s=new URLSearchParams(location.search).get('p');if(s)openP(s,false);else hide()});
function sync(){const u=new URL(location.href);if(cat)u.searchParams.set('c',slug(cat));else u.searchParams.delete('c');u.searchParams.delete('p');history.replaceState(null,'',u)}
const hello='Hola PVCENTRO, vengo del catálogo web y quiero una cotización.';
$('#waTop').href=waUrl(hello);$('#waFab').href=waUrl(hello);
const sp=new URLSearchParams(location.search);
if(sp.get('c')){const c=cats.find(x=>slug(x)===sp.get('c'));if(c)cat=c}
if(sp.get('q'))$('#q').value=sp.get('q');
chips();draw();
if(sp.get('p'))openP(sp.get('p'),false);
</script>
